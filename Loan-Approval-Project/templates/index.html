<!DOCTYPE html>
<html>
<head>
    <title>Loan Approval Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Loan Approval Prediction</h1>

    <p class="subtitle">
        Enter applicant details to predict loan approval
    </p>

    <form id="loanForm">

        <div class="form-group">
            <label>Gender</label>
            <select id="Gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>


        <div class="form-group">
            <label>Married</label>
            <select id="Married">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>


        <div class="form-group">
            <label>Dependents</label>
            <select id="Dependents">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3+">3+</option>
            </select>
        </div>


        <div class="form-group">
            <label>Education</label>
            <select id="Education">
                <option value="Graduate">Graduate</option>
                <option value="Not Graduate">Not Graduate</option>
            </select>
        </div>


        <div class="form-group">
            <label>Self Employed</label>
            <select id="Self_Employed">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>


        <div class="form-group">
            <label>Applicant Income</label>
            <input type="number"
                   id="ApplicantIncome"
                   placeholder="Enter applicant income"
                   required>
        </div>


        <div class="form-group">
            <label>Coapplicant Income</label>
            <input type="number"
                   id="CoapplicantIncome"
                   placeholder="Enter coapplicant income"
                   required>
        </div>


        <div class="form-group">
            <label>Loan Amount</label>
            <input type="number"
                   id="LoanAmount"
                   placeholder="Enter loan amount"
                   required>
        </div>


        <div class="form-group">
            <label>Loan Amount Term</label>
            <select id="Loan_Amount_Term">
                <option value="360">360 months</option>
                <option value="180">180 months</option>
                <option value="120">120 months</option>
                <option value="84">84 months</option>
                <option value="60">60 months</option>
                <option value="36">36 months</option>
            </select>
        </div>


        <div class="form-group">
            <label>Credit History</label>
            <select id="Credit_History">
                <option value="1">Good</option>
                <option value="0">Bad</option>
            </select>
        </div>


        <div class="form-group">
            <label>Property Area</label>
            <select id="Property_Area">
                <option value="Urban">Urban</option>
                <option value="Semiurban">Semiurban</option>
                <option value="Rural">Rural</option>
            </select>
        </div>


        <button type="submit">
            Check Loan Eligibility
        </button>

    </form>


    <div id="result"></div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
